[package]
name = "mekugi-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mekugi_transport"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
async-trait = "0.1"
futures = "0.3"
http = "1"
prost = "0.13"
pyo3 = { version = "0.24", features = ["abi3-py312"], optional = true }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tonic = { version = "0.13", features = ["transport", "tls-ring", "tls-native-roots"] }
tracing = "0.1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.13"
